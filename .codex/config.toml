# Project defaults; explicit session/spawn settings may override these.
# Policy: docs/decisions/D-0004-model-and-usage-budget.md
# M4-13: explicitly select Astra/medium for the primary in the composer.
# Keep Sol/medium children; AGENTS.md requires automatic independent review.
# This file does not change an already-running session model.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"
